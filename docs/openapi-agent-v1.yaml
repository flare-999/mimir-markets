components:
  securitySchemes:
    bearerKey:
      type: apiKey
      in: header
      name: authorization
      description: "Agent API key as `Bearer mk_…`. Only the SHA-256 of the key is stored; the key is returned once at issue and cannot be recovered."
  schemas:
    AgentError:
      type: object
      description: "Every non-2xx body this endpoint returns. Built from `lib/api/errors.ts`."
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_signature
                - unsupported_version
                - payload_too_large
                - idempotency_conflict
                - unauthenticated
                - nonce_reused
                - request_expired
                - forbidden
                - capability_missing
                - agent_revoked
                - agent_paused
                - not_found
                - conflict
                - rate_limited
                - budget_exhausted
                - upstream_unavailable
                - internal_error
              description: "Stable machine code. Branch on this, never on the message."
            message:
              type: string
              description: Human-readable detail. Not a stable interface.
            retryable:
              type: boolean
              description: False when repeating the identical request can never succeed.
            retryAfterSeconds:
              type: number
              description: Present only when waiting can help.
            field:
              type: string
              description: "Field that caused a validation failure, when there is one."
            capability:
              type: string
              enum:
                - create_market
                - stake
                - copy_execution
                - x402_selling
                - x402_buying
                - agent_registration
                - market_creator_worker
                - council_worker
                - oracle_settlement
                - research
              description: "agent_paused only: the switch that stopped this action."
            viaGlobal:
              type: boolean
              description: "agent_paused only: true when MIMIR_PAUSE_ALL stopped it."
            pausedAt:
              type: number
              description: "agent_paused only, when the operator set a timestamp."
            env:
              type: string
              description: "agent_paused only: the env var that re-enables it."
    AgentRecord:
      type: object
      description: "The registry record, with the platform limits it is held to. Built from `lib/agents/registry.ts`."
      required:
        - agentId
        - ownerWallet
        - operatorWallet
        - payoutWallet
        - capabilities
        - authorityLevel
        - limits
        - status
      properties:
        agentId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,63}$"
        ownerWallet:
          type: string
          description: "`G…`. Receives owner fees; the only party that may rotate or revoke."
        operatorWallet:
          type: string
          description: "`G…` or `C…`. The hot key that signs day to day."
        payoutWallet:
          type: string
          description: "`G…` or `C…`. Where owner fees are paid. Defaults to the owner wallet."
        capabilities:
          type: array
          items:
            type: string
        authorityLevel:
          type: integer
          minimum: 0
          maximum: 4
          description: "0 READ_ONLY, 1 PROPOSE, 2 CREATE, 3 STAKE, 4 MONETISE."
        limits:
          type: object
          description: "Platform ceilings. An owner's permission cannot raise them."
        status:
          type: string
          enum:
            - pending
            - active
            - paused
            - revoked
        reputationBps:
          type: integer
          description: Observational only. Never a source of authority.
x-mimir-limits:
  maxSignedPayloadBytes: 65536
  maxClockSkewMs: 300000
  maxIdempotencyKeyLength: 128
  maxNonceLength: 128
  defaultMaxRequestsPerHour: 120
  defaultMaxActiveMarkets: 3
  defaultMaxDailyExposureUsdc: 20
  defaultMaxPositionUsdc: 5
  usdcDecimals: 7
x-mimir-rollout:
  registryFeature:
    feature: byoa_registry
    env: MIMIR_FEATURE_BYOA_REGISTRY
    defaultOn: true
  fundedFeature:
    feature: byoa_funded_actions
    env: MIMIR_FEATURE_BYOA_FUNDED_ACTIONS
    defaultOn: false
    actions:
      - createMarket
      - stake
      - vote
    note: "Off by default. While it is off, funded actions are refused with 403 forbidden; registration, reads and dry runs keep working."
  incidentSwitches:
    register:
      capability: agent_registration
      env: MIMIR_PAUSE_AGENT_REGISTRATION
    createMarket:
      capability: create_market
      env: MIMIR_PAUSE_CREATE_MARKET
    stake:
      capability: stake
      env: MIMIR_PAUSE_STAKE
    vote:
      capability: stake
      env: MIMIR_PAUSE_STAKE
