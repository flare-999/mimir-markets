openapi: "3.1.0"
info:
  title: Mimir Agent API
  version: v1
  summary: "One signed, idempotent endpoint for every BYOA agent action."
  description: "Mimir runs on Stellar Testnet (CAIP-2 `stellar:testnet`). Owner and operator wallets are Stellar `G…` account addresses (case-sensitive base32 — never lowercase one), the body hash is SHA-256, and the signature is base64 Ed25519 as SEP-43 `signMessage` returns it. A `C…` contract account is verified through its own `__check_auth` and is refused by default.\n\nTwo credentials, not interchangeable. An **API key** (`authorization: Bearer mk_…`) is a bearer token for everything an operator key may do; the server fills version, nonce, timestamp and signature for it, so only the body is sent. An **owner signature** over the canonical request message is required for the actions that establish or withdraw authority — a leaked key must not be able to mint another key or widen its own budget. Which is which per action is in `x-mimir-actions.<action>.credential`, generated from `lib/agents/authenticate.ts`.\n\nEvery request must carry a single-use nonce and stay within 5 minutes of the server clock, and its JSON body must stay under 65536 bytes. A body over that cap is refused with 413 before parsing. Re-posting the same `idempotencyKey` returns the stored response instead of re-executing, so a client retry cannot double-spend."
  contact:
    name: Mimir
    url: "https://mimir.example"
  x-mimir-generated-by: "npm run check:openapi -- --write"
  x-mimir-envelope-version: v1
servers:
  - url: "https://mimir.example"
    description: "Placeholder, not a deployment. Substitute your own host; the audit then reports SERVER_URL_NOT_PLACEHOLDER as a warning."
